      description: Additional (optional) parameters for the Highlight compute expression.
      type: object
      properties:
        rank_fragments_by:
          description: >
            How to rank candidate fragments within the attribute before
            selecting the top `fragment_limit`. Defaults to the query's `rank_by`.
          x-stainless-any: true
        fragment_by: { $ref: "#/components/schemas/HighlightFragmentBy" }
        fragment_limit:
          type: integer
          description: The maximum number of fragments to return. Defaults to `3`.
        include_offsets: { $ref: "#/components/schemas/HighlightOffsetUnits" }
      additionalProperties: false
    HighlightFragmentBy:
      description: How to split a text attribute into fragments for highlighting.
      anyOf:
        - const: none
          description: Treat the whole attribute as a single fragment.
        - const: sentence
          description: Split the attribute into sentences. This is the default.
        - const: paragraph
          description: Split the attribute into paragraphs.
        - const: word
          description: Split the attribute into individual words.
    HighlightOffsetUnits:
      description: The units to report highlighted fragment offsets in.
      anyOf:
        - const: utf-8
        - const: utf-16
        - const: codepoints
    HighlightMatch:
      description: >
        A single matched fragment for a `Highlight` compute attribute. A
        `Highlight` compute attribute's value in the response is an array of
        these objects, one per matching fragment.
      type: object
      properties:
        text:
          type: string
          description: The text of the matched fragment.
        fragment_range:
          description: >
            The `[start, end]` offset of this fragment within the original
            attribute value, in the units requested by `include_offsets`.
            Omitted if `include_offsets` was not set.
          type: array
          items: { type: integer }
          minItems: 2
          maxItems: 2
        match_ranges:
          description: >
            The `[start, end]` offsets of matched spans within `text`, in the
            units requested by `include_offsets`. Omitted if `include_offsets`
            was not set.
          type: array
          items:
            type: array
            items: { type: integer }
            minItems: 2
            maxItems: 2
        array_index:
          description: >
            The index into the array, if the highlighted attribute is an
            array of strings. Omitted for non-array attributes.
          type: integer
      required: [text]

